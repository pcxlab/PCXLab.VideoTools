name: Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:

  Test:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck

    - name: Run Tests
      shell: pwsh
      run: |
        Invoke-Pester Tests -CI